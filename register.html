<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voter Registration - Online Voting System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
          <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-success-subtle text-success mb-2">
              <i class="bi bi-person-plus-fill fs-1"></i>
            </div>
            <h3 class="fw-bold text-dark">Voter Registration</h3>
            <p class="text-muted small">Register your student account to cast certified ballots in university elections</p>
          </div>

          <div id="register-alert"></div>

          <form id="register-form">
            <div class="mb-3">
              <label for="reg-fullname" class="form-label small fw-semibold">Full Legal Name</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="reg-fullname" placeholder="e.g. John Doe" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="reg-email" class="form-label small fw-semibold">Institutional Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="reg-email" placeholder="name@voting.local" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="reg-password" class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="reg-password" placeholder="Minimum 6 characters" minlength="6" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="reg-confirm-password" class="form-label small fw-semibold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="reg-confirm-password" placeholder="Re-enter password" minlength="6" required>
              </div>
            </div>

            <div class="alert alert-light border small text-muted mb-4 py-2">
              <i class="bi bi-info-circle me-1"></i>
              Registrations automatically acquire <code>voter</code> permissions and are eligible to vote upon submission.
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-check2-circle me-1"></i> Create Account
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">Already registered? </span>
            <a href="login.html" class="small fw-semibold text-decoration-none">Sign In to Account</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
