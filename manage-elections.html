<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Elections - Online Voting System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container my-5" id="manage-elections-container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-1">
            <li class="breadcrumb-item"><a href="admin-dashboard.html">Admin</a></li>
            <li class="breadcrumb-item active" aria-current="page">Elections</li>
          </ol>
        </nav>
        <h2 class="fw-bold mb-0 text-dark">Elections Management</h2>
      </div>
      <button id="btn-new-election" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i> Create New Election
      </button>
    </div>

    <!-- Elections Data Table -->
    <div class="card shadow-sm border-0 mb-5">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width: 70px;">ID</th>
                <th>Title & Description</th>
                <th>Schedule Window</th>
                <th>Status</th>
                <th>Results</th>
                <th>Ballots</th>
                <th style="width: 120px;">Actions</th>
              </tr>
            </thead>
            <tbody id="elections-table-tbody">
              <tr>
                <td colspan="7" class="text-center py-4 text-muted">
                  <div class="spinner-border spinner-border-sm text-primary me-2"></div> Loading elections...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Create / Edit Election Modal -->
    <div class="modal fade" id="electionModal" tabindex="-1" aria-labelledby="electionModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <form id="election-form">
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title fw-bold" id="electionModalLabel">Create New Election</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
              <input type="hidden" id="election-id">

              <div class="mb-3">
                <label for="election-title" class="form-label small fw-semibold">Election Title</label>
                <input type="text" class="form-control" id="election-title" placeholder="e.g. Student Council Presidential Election 2026" required>
              </div>

              <div class="mb-3">
                <label for="election-description" class="form-label small fw-semibold">Description / Manifesto Summary</label>
                <textarea class="form-control" id="election-description" rows="3" placeholder="Provide background, guidelines, and context for eligible voters..."></textarea>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="election-start-time" class="form-label small fw-semibold">Start Date & Time (UTC/Local)</label>
                  <input type="datetime-local" class="form-control" id="election-start-time" required>
                </div>
                <div class="col-md-6">
                  <label for="election-end-time" class="form-label small fw-semibold">End Date & Time (UTC/Local)</label>
                  <input type="datetime-local" class="form-control" id="election-end-time" required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="election-status" class="form-label small fw-semibold">Lifecycle Status</label>
                  <select class="form-select" id="election-status">
                    <option value="draft">Draft (Hidden from voters)</option>
                    <option value="published">Published (Active / Voting Open)</option>
                    <option value="closed">Closed (Voting Concluded)</option>
                  </select>
                </div>
                <div class="col-md-6 d-flex align-items-center">
                  <div class="form-check form-switch mt-3">
                    <input class="form-check-input" type="checkbox" role="switch" id="election-results-visible">
                    <label class="form-check-label small fw-semibold" for="election-results-visible">
                      Publicly Disclose Live Standings & Results
                    </label>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary px-4 fw-semibold">Save Election</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
