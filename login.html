<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Online Voting System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
          <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
              <i class="bi bi-person-lock fs-1"></i>
            </div>
            <h3 class="fw-bold text-dark">Portal Authentication</h3>
            <p class="text-muted small">Enter your registered credentials to access your voting dashboard</p>
          </div>

          <!-- Demo Quick-Fill Buttons -->
          <div class="card bg-light border-0 p-3 mb-3">
            <span class="small fw-semibold text-muted d-block mb-2 text-uppercase" style="font-size: 0.75rem;">
              <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Demo Credentials Quick-Fill
            </span>
            <div class="d-flex gap-2">
              <button type="button" id="btn-fill-admin" class="btn btn-outline-danger btn-sm flex-grow-1">
                <i class="bi bi-shield-lock me-1"></i> Admin Demo
              </button>
              <button type="button" id="btn-fill-voter" class="btn btn-outline-primary btn-sm flex-grow-1">
                <i class="bi bi-person-check me-1"></i> Voter Demo
              </button>
            </div>
          </div>

          <div id="login-alert"></div>

          <form id="login-form">
            <div class="mb-3">
              <label for="login-email" class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="login-email" placeholder="name@voting.local" required autocomplete="username">
              </div>
            </div>

            <div class="mb-4">
              <label for="login-password" class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="login-password" placeholder="Enter password" required autocomplete="current-password">
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">New voter? </span>
            <a href="register.html" class="small fw-semibold text-decoration-none">Create a Voter Account</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
