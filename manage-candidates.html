<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Candidates - Online Voting System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container my-5" id="manage-candidates-container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-1">
            <li class="breadcrumb-item"><a href="admin-dashboard.html">Admin</a></li>
            <li class="breadcrumb-item active" aria-current="page">Candidates</li>
          </ol>
        </nav>
        <h2 class="fw-bold mb-0 text-dark">Candidate Roster Management</h2>
      </div>
      <button id="btn-add-candidate" class="btn btn-primary" disabled>
        <i class="bi bi-person-plus me-1"></i> Add Candidate
      </button>
    </div>

    <!-- Election Selector Filter -->
    <div class="card shadow-sm border-0 p-3 mb-4 bg-white">
      <div class="row align-items-center">
        <div class="col-md-3">
          <label for="candidate-election-select" class="form-label mb-0 fw-semibold text-muted small">
            Select Election Cycle:
          </label>
        </div>
        <div class="col-md-9">
          <select id="candidate-election-select" class="form-select">
            <option value="">Loading available elections...</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Candidates Table -->
    <div class="card shadow-sm border-0 mb-5">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width: 70px;">Photo</th>
                <th>Candidate Name & Bio</th>
                <th>Party Affiliation</th>
                <th>Date Added</th>
                <th style="width: 120px;">Actions</th>
              </tr>
            </thead>
            <tbody id="candidates-table-tbody">
              <tr>
                <td colspan="5" class="text-center py-4 text-muted">
                  Please select an election from the dropdown above to view its candidates.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Add / Edit Candidate Modal -->
    <div class="modal fade" id="candidateModal" tabindex="-1" aria-labelledby="candidateModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="candidate-form">
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title fw-bold" id="candidateModalLabel">Add Candidate</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
              <input type="hidden" id="candidate-id">

              <div class="mb-3">
                <label for="candidate-name" class="form-label small fw-semibold">Candidate Full Name</label>
                <input type="text" class="form-control" id="candidate-name" placeholder="e.g. Maya Lin" required>
              </div>

              <div class="mb-3">
                <label for="candidate-party" class="form-label small fw-semibold">Party / Coalition Name</label>
                <input type="text" class="form-control" id="candidate-party" placeholder="e.g. Progressive Student Union" required>
              </div>

              <div class="mb-3">
                <label for="candidate-photo" class="form-label small fw-semibold">Photo URL (Optional)</label>
                <input type="url" class="form-control" id="candidate-photo" placeholder="https://example.com/photo.jpg">
                <div class="form-text small">Leave blank to use the default avatar illustration.</div>
              </div>

              <div class="mb-3">
                <label for="candidate-description" class="form-label small fw-semibold">Candidate Bio & Key Priorities</label>
                <textarea class="form-control" id="candidate-description" rows="3" placeholder="Brief manifesto or candidate profile..."></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary px-4 fw-semibold">Save Candidate</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
